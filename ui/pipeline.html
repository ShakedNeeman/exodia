<!doctype html>

<head>

  <title>Aperture — File pipeline</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0e12; --elev: #13171d; --line: #2a3340; --text: #eef2f6;
      --muted: #8d98a6; --faint: #6b7582; --accent: #f0a14a; --accent-dim: #3d2a14;
      --signal: #3ddc97; --signal-dim: #123528; --blue: #7eb6ff; --blue-dim: #173047;
      --rose: #f07167;
      --sans: "IBM Plex Sans Hebrew", "IBM Plex Sans", sans-serif;
      --display: "Syne", "IBM Plex Sans Hebrew", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    html[lang="en"] { direction: ltr; }
    html[lang="en"] body { font-family: "IBM Plex Sans", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
    body { display: grid; grid-template-rows: 52px 1fr 64px; }
    .top { display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .brand { font-family: var(--display); font-weight: 700; }
    .brand em { color: var(--accent); font-style: normal; }
    .nav a { color: var(--muted); text-decoration: none; margin-inline-end: 10px; font-size: 13px; }
    .nav a.on { color: var(--text); }
    .lang { margin-inline-start: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--elev); }
    .lang button { border: 0; background: none; color: var(--muted); font: inherit; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
    .lang button.on { background: var(--accent-dim); color: var(--accent); }
    .stage { padding: 22px 28px 12px; overflow: auto; }
    .kicker { color: var(--accent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    h1 { font-family: var(--display); font-size: 26px; letter-spacing: -0.03em; margin: 4px 0 8px; }
    .who { color: var(--muted); font-size: 14px; margin: 0 0 12px; max-width: 70em; }
    .dbs { display: grid; grid-template-columns: 1.15fr 1fr 0.85fr 0.85fr; gap: 8px; }
    @media (max-width: 980px) { .dbs { grid-template-columns: 1fr 1fr; } }
    .db { background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 148px; }
    .db h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
    .db.hit { border-color: var(--accent); }
    .db.s3.hit { border-color: #1f5a40; }
    .db.os.hit { border-color: #2a4d6d; }
    .db pre, .row { font-family: var(--mono); font-size: 11px; direction: ltr; text-align: left; color: #d7dee6; margin: 0; white-space: pre-wrap; line-height: 1.45; }
    .empty { color: var(--faint); font-size: 13px; }
    .chg { color: var(--accent); }
    .ok { color: var(--signal); }
    .foot { border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 16px; }
    .foot button { background: #1a2028; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; cursor: pointer; font: inherit; }
    .foot button.primary { background: var(--accent); color: #1a1208; border-color: #d48a30; font-weight: 600; }
    .bar { flex: 1; height: 5px; background: #2a313b; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
    .count { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  </style>
</head>

let lang = "he";
let i = 0;
const $ = (id) => document.getElementById(id);

function render() {
  const L = T[lang];
  const s = STEPS[lang][i];
  const hit = (n) => s.hit.includes(n) ? " hit" : "";
  $("stage").innerHTML = `
    <div class="kicker">${s.k} · ${FILE[lang]}</div>
    <h1>${s.h}</h1>
    <p class="who">${s.who}</p>
    <div class="dbs">
      <div class="db pg${hit("pg")}"><h2>${L.pg}</h2><pre>${s.pg}</pre></div>
      <div class="db rd${hit("rd")}"><h2>${L.rd}</h2><pre>${s.rd}</pre></div>
      <div class="db s3${hit("s3")}"><h2>${L.s3}</h2><pre>${s.s3}</pre></div>
      <div class="db os${hit("os")}"><h2>${L.os}</h2><pre>${s.os}</pre></div>
    </div>`;
  $("count").textContent = (i + 1) + " / " + STEPS[lang].length;
  $("bar").style.width = ((i + 1) / STEPS[lang].length * 100) + "%";
  document.querySelectorAll("[data-i]").forEach((el) => {
    const k = el.getAttribute("data-i");
    if (L[k]) el.textContent = L[k];
  });
  $("btn-en").classList.toggle("on", lang === "en");
  $("btn-he").classList.toggle("on", lang === "he");
}
function apply(next) {
  lang = next;
  document.documentElement.lang = next;
  document.documentElement.dir = next === "he" ? "rtl" : "ltr";
  render();
}
$("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
$("next").onclick = () => { i = Math.min(STEPS[lang].length - 1, i + 1); render(); };
$("btn-en").onclick = () => apply("en");
$("btn-he").onclick = () => apply("he");
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const fwd = document.documentElement.dir === "rtl" ? e.key === "ArrowLeft" : e.key === "ArrowRight";
  i = fwd ? Math.min(STEPS[lang].length - 1, i + 1) : Math.max(0, i - 1);
  render();
});
apply("he");
</script>
</body>
</html>
