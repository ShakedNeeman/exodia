<html lang="he" dir="rtl">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0e12; --elev: #13171d; --line: #2a3340; --text: #eef2f6;
      --muted: #8d98a6; --faint: #6b7582; --accent: #f0a14a; --accent-dim: #3d2a14;
      --signal: #3ddc97; --blue: #7eb6ff; --blue-dim: #173047;
      --sans: "IBM Plex Sans Hebrew", "IBM Plex Sans", sans-serif;
      --display: "Syne", "IBM Plex Sans Hebrew", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    html[lang="en"] { direction: ltr; }
    html[lang="en"] body { font-family: "IBM Plex Sans", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
    body { display: grid; grid-template-rows: 52px 44px 1fr 64px; }
    .top, .tabs, .foot { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .foot { border-bottom: 0; border-top: 1px solid var(--line); }
    .brand { font-family: var(--display); font-weight: 700; }
    .brand em { color: var(--accent); font-style: normal; }
    .lang { margin-inline-start: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--elev); }
    .lang button, .tabs button, .foot button {
      border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer;
    }
    .lang button { padding: 4px 10px; border-radius: 999px; }
    .lang button.on, .tabs button.on { background: var(--accent-dim); color: var(--accent); }
    .tabs { gap: 6px; }
    .tabs button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--elev); }
    .stage { padding: 18px 22px 12px; overflow: auto; }
    .kicker { color: var(--accent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    h1 { font-family: var(--display); font-size: 24px; letter-spacing: -0.03em; margin: 4px 0 8px; }
    .kid { background: var(--accent-dim); border: 1px solid #6a4a20; border-radius: 12px; padding: 10px 12px; color: #f3d2a8; font-size: 15px; margin: 0 0 12px; max-width: 70em; }
    .dbs { display: grid; grid-template-columns: 1.2fr 0.9fr 0.9fr 0.85fr; gap: 8px; }
    @media (max-width: 1000px) { .dbs { grid-template-columns: 1fr 1fr; } }
    .db { background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .db h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
    .db.hit { border-color: var(--accent); }
    .db.s3.hit { border-color: #1f5a40; }
    .db.os.hit { border-color: #2a4d6d; }
    pre { font-family: var(--mono); font-size: 11px; direction: ltr; text-align: left; color: #d7dee6; margin: 0; white-space: pre-wrap; line-height: 1.4; }
    .hidden { display: none !important; }
    .foot button { background: #1a2028; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; }
    .foot button.primary { background: var(--accent); color: #1a1208; border-color: #d48a30; font-weight: 600; }
    .bar { flex: 1; height: 5px; background: #2a313b; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
    .count { font-family: var(--mono); font-size: 12px; color: var(--faint); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: start; border-bottom: 1px solid var(--line); padding: 7px 6px; vertical-align: top; }
    th { color: var(--faint); font-weight: 500; }
    .uml { background: #10141a; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    .comp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .comp { border: 1px solid #3a4656; border-radius: 4px; padding: 10px; background: var(--elev); }
    .comp.plane { border-color: #6a4a20; }
    .comp.data { border-color: #1f5a40; }
    .comp h3 { margin: 0 0 4px; font-size: 14px; }
    .comp p { margin: 0; color: var(--muted); font-size: 12px; }
    .stereo { color: var(--faint); font-family: var(--mono); font-size: 10px; }
    .ui-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fake {
      background: var(--elev); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 220px;
    }
    .fake h3 { margin: 0 0 8px; font-size: 14px; }
    .qrow { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .pbar { height: 5px; background: #2a313b; border-radius: 99px; margin-top: 6px; overflow: hidden; }
    .pbar i { display: block; height: 100%; background: var(--accent); }
    .chip { display: inline-block; font-size: 11px; font-family: var(--mono); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; }
    .note { color: var(--muted); font-size: 14px; max-width: 54em; }
  </style>
</head>

let lang = "he";
let i = 0;
let tab = "flow";
const $ = (id) => document.getElementById(id);

function renderFlow() {
  const s = STEPS[lang][i];
  const L = I[lang];
  const hit = (n) => (s.hit || []).includes(n) ? " hit" : "";
  if (s.fail) {
    $("tab-flow").innerHTML = `<div class="kicker">${s.k}</div><h1>${s.h}</h1><p class="kid">${s.kid}</p>${FAIL[lang]}`;
  } else {
    $("tab-flow").innerHTML = `<div class="kicker">${s.k} · hangar.mp4 · 2GB · 8 פרוסות · 3 באוויר</div>
      <h1>${s.h}</h1><p class="kid">${s.kid}</p>
      <div class="dbs">
        <div class="db pg${hit("pg")}"><h2>${L.pg}</h2><pre>${s.pg}</pre></div>
        <div class="db rd${hit("rd")}"><h2>${L.rd}</h2><pre>${s.rd}</pre></div>
        <div class="db s3${hit("s3")}"><h2>${L.s3}</h2><pre>${s.s3}</pre></div>
        <div class="db os${hit("os")}"><h2>${L.os}</h2><pre>${s.os}</pre></div>
      </div>`;
  }
  $("count").textContent = (i + 1) + " / " + STEPS[lang].length;
  $("bar").style.width = ((i + 1) / STEPS[lang].length * 100) + "%";
}

function renderStatic() {
  $("tab-uml").innerHTML = UML[lang];
  $("tab-ui").innerHTML = UI[lang];
  $("t-flow").textContent = I[lang].flow;
  $("t-uml").textContent = I[lang].uml;
  $("t-ui").textContent = I[lang].ui;
  $("prev").textContent = I[lang].prev;
  $("next").textContent = I[lang].next;
}

function showTab(name) {
  tab = name;
  ["flow","uml","ui"].forEach((n) => {
    $("tab-" + n).classList.toggle("hidden", n !== name);
    $("t-" + n).classList.toggle("on", n === name);
  });
  $("foot").style.display = name === "flow" ? "flex" : "none";
}

function apply(next) {
  lang = next;
  document.documentElement.lang = next;
  document.documentElement.dir = next === "he" ? "rtl" : "ltr";
  $("btn-en").classList.toggle("on", next === "en");
  $("btn-he").classList.toggle("on", next === "he");
  renderFlow();
  renderStatic();
}

$("prev").onclick = () => { i = Math.max(0, i - 1); renderFlow(); };
$("next").onclick = () => { i = Math.min(STEPS[lang].length - 1, i + 1); renderFlow(); };
$("btn-en").onclick = () => apply("en");
$("btn-he").onclick = () => apply("he");
["flow","uml","ui"].forEach((n) => $("t-" + n).onclick = () => showTab(n));
document.addEventListener("keydown", (e) => {
  if (tab !== "flow") return;
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const fwd = document.documentElement.dir === "rtl" ? e.key === "ArrowLeft" : e.key === "ArrowRight";
  i = fwd ? Math.min(STEPS[lang].length - 1, i + 1) : Math.max(0, i - 1);
  renderFlow();
});
apply("he");
showTab("flow");
</script>
