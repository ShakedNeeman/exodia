<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aperture — Present</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0e12; --elev: #13171d; --line: #2a3340; --text: #eef2f6;
      --muted: #8d98a6; --faint: #6b7582; --accent: #f0a14a;
      --accent-dim: #3d2a14; --signal: #3ddc97; --signal-dim: #123528;
      --blue: #7eb6ff; --blue-dim: #173047;
      --sans: "IBM Plex Sans Hebrew", "IBM Plex Sans", sans-serif;
      --display: "Syne", "IBM Plex Sans Hebrew", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    html[lang="en"] { direction: ltr; }
    html[lang="en"] body { font-family: "IBM Plex Sans", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
    body { display: grid; grid-template-rows: 52px 1fr 72px; }
    .top {
      display: flex; align-items: center; gap: 14px; padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-family: var(--display); font-weight: 700; }
    .brand em { color: var(--accent); font-style: normal; }
    .nav a { color: var(--muted); text-decoration: none; margin-inline-end: 12px; font-size: 14px; }
    .nav a.on { color: var(--text); }
    .lang { margin-inline-start: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--elev); }
    .lang button { border: 0; background: none; color: var(--muted); font: inherit; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
    .lang button.on { background: var(--accent-dim); color: var(--accent); }
    .stage { padding: 36px 48px 16px; overflow: auto; }
    .kicker { color: var(--accent); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px; }
    h1 { font-family: var(--display); font-size: 40px; letter-spacing: -0.04em; line-height: 1.15; margin: 0 0 16px; }
    h1.small { font-size: 30px; }
    p { color: #d7dee6; font-size: 18px; max-width: 40em; margin: 0 0 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 920px; }
    .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 800px) { .grid2, .grid4 { grid-template-columns: 1fr; } .stage { padding: 20px; } h1 { font-size: 28px; } }
    .card { background: var(--elev); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .card b { display: block; margin-bottom: 6px; }
    .card span, .card p { color: var(--muted); font-size: 15px; margin: 0; }
    .card.pg { border-color: #2a4d6d; }
    .card.rd { border-color: #6a4a20; }
    .mono { font-family: var(--mono); font-size: 13px; color: #f0c14a; direction: ltr; text-align: left; display: block; white-space: pre-wrap; }
    table { width: 100%; max-width: 920px; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: start; border-bottom: 1px solid var(--line); padding: 8px 6px; vertical-align: top; }
    th { color: var(--faint); font-weight: 500; }
    .say {
      margin-top: 18px; padding: 10px 14px; border-radius: 10px;
      background: var(--accent-dim); border: 1px solid #6a4a20; color: #f3d2a8; font-size: 15px;
    }
    .say strong { color: var(--accent); }
    .foot {
      border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
      padding: 0 18px; background: #0e1217;
    }
    .foot button {
      background: #1a2028; border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 8px 14px; cursor: pointer; font: inherit;
    }
    .foot button.primary { background: var(--accent); color: #1a1208; border-color: #d48a30; font-weight: 600; }
    .bar { flex: 1; height: 5px; background: #2a313b; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
    .count { font-family: var(--mono); font-size: 12px; color: var(--faint); min-width: 48px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">ape<em>rture</em></div>
    <nav class="nav">
      <a href="index.html" data-i="navHome">בית</a>
      <a class="on" href="present.html" data-i="navPresent">הצגה</a>
      <a href="pipeline.html" data-i="navPipe">פלואו</a>
      <a href="uml.html" data-i="navUml">UML</a>
      <a href="upload.html" data-i="navUpload">העלאה</a>
      <a href="browse.html" data-i="navBrowse">גלישה</a>
    </nav>
    <div class="lang">
      <button type="button" id="btn-en">EN</button>
      <button type="button" id="btn-he" class="on">עב</button>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="foot">
    <button type="button" id="prev" data-i="prev">הקודם</button>
    <button type="button" class="primary" id="next" data-i="next">הבא</button>
    <div class="bar"><i id="bar"></i></div>
    <span class="count" id="count">1 / 7</span>
  </footer>

<script>
const T = {
  he: {
    navHome: "בית", navPresent: "הצגה", navPipe: "פלואו", navUml: "UML", navUpload: "העלאה", navBrowse: "גלישה",
    prev: "הקודם", next: "הבא",
    say: "מה להגיד",
    slides: [
      {
        k: "שקף 1 · הבעיה",
        h: "עשרות טרה מפוזרים. ואי אפשר לדפדף בהם.",
        html: `<p>זה מה שכתוב במטלה. האחסון כבר גדול, והוא גדל. הקבצים לא מסוג אחד, והם לא מסודרים בדרך שאנשים יכולים באמת למצוא.</p>
        <p>המערכת צריכה שתי יכולות: <b>להעלות</b> ו<b>לגלוש בצורה לוגית</b>.</p>`,
        say: "הבעיה היא לא עוד דיסק. הבעיה היא להכניס קבצים גדולים ומגוונים בלי לאבד אותם, ואז למצוא אותם בלי ללכת ל-/mnt/storage3."
      },
      {
        k: "שקף 2 · הדרישות",
        h: "ארבע דרישות. ככה פתרתי כל אחת.",
        html: `<table>
          <tr><th>המטלה ביקשה</th><th>איך פתרתי</th></tr>
          <tr><td>העלאות אמינות בהיקף טרה</td><td>הדפדפן מעלה חלקים ישר ל-S3. חלק שנפל חוזר לבד. טאב שנסגר ממשיך, לא מתחיל מחדש.</td></tr>
          <tr><td>דאטה מגוון — מסמכים, תמונות, וידאו, רדאר</td><td>רשומה לוגית בקטלוג. האובייקט ב-S3 יכול להיות אחד או כמה. סוג לא מוכר נשאר אזרח מלא.</td></tr>
          <tr><td>מטא-דאטה של המשתמש בזמן ההעלאה</td><td>נשמר לפני הבייט הראשון. גם העלאה שנפלה אחרי שש שעות עדיין יש לה שם ומשימה.</td></tr>
          <tr><td>העשרה טכנית אוטומטית איפה שאפשר</td><td>אחרי שהקובץ נחת, עובד ברקע שולף כותרות. אם אין parser — הקובץ לא נעלם.</td></tr>
        </table>`,
        say: "כל שורה במטלה הפכה לכלל עיצוב. לא התחלתי מכלים — התחלתי מהדרישה."
      },
      {
        k: "שקף 3 · הרעיון",
        h: "פיצלתי בייטים ממשמעות.",
        html: `<div class="grid2">
          <div class="card" style="border-color:#1f5a40"><b>המחסן · Amazon S3</b><span>הבייטים. העלאה בחלקים. השרת לא מעביר את הקובץ — הוא רק חותם קישור זמני.</span></div>
          <div class="card rd"><b>הקטלוג · API + Postgres</b><span>המשמעות. שם, אוסף, תגיות, מצב, הרשאות. מכאן מחפשים, לא מהמחסן.</span></div>
        </div>
        <p style="margin-top:16px">אם ה-API מעביר טרה, הוא נהיה צינור. אם הקטלוג הוא עץ תיקיות, חוזרים לאותו בלגן.</p>`,
        say: "חתמתי URL. לא העברתי קובץ. S3 שומר ומדביק חלקים. הקטלוג אומר מה זה ולמי מותר לראות."
      },
      {
        k: "שקף 4 · מקצה לקצה",
        h: "לקוח, שרת, אחסון, עיבוד — כמו שביקשו.",
        html: `<table>
          <tr><th></th><th>לקוח</th><th>שרת</th><th>אחסון</th><th>עיבוד</th></tr>
          <tr><td><b>1 כוונה</b></td><td>מטא-דאטה + קובץ</td><td>יוצר רשומה</td><td>פותח העלאה בחלקים</td><td>—</td></tr>
          <tr><td><b>2 העברה</b></td><td>חלקים ישר ל-S3</td><td>זוכר מה נחת</td><td>שומר חלקים</td><td>—</td></tr>
          <tr><td><b>3 חותמת</b></td><td>סיימתי</td><td>בודק שלמות</td><td>מרכיב קובץ אחד</td><td>—</td></tr>
          <tr><td><b>4 העשרה</b></td><td>גלישה</td><td>מעדכן קטלוג</td><td>קריאה + תצוגה</td><td>שולף מטא-דאטה טכני</td></tr>
        </table>
        <p style="margin-top:12px">מהשלב השלישי הקובץ כבר ניתן להורדה. העשרה לא חוסמת אותו.</p>`,
        say: "זה כל הפלואו. ארבעה שלבים, ארבע שכבות. אם parser נכשל אחרי זה — הקובץ עדיין בקטלוג."
      },
      {
        k: "שקף 5 · הכלים",
        h: "סטאק קטן. כל כלי לדרישה.",
        html: `<table>
          <tr><th>שכבה</th><th>כלי</th><th>למה</th></tr>
          <tr><td>העלאה וגלישה</td><td>React</td><td>תור ארוך, resume, inspector</td></tr>
          <tr><td>קטלוג</td><td>Spring Boot + Postgres</td><td>רשומות, מצבים, הרשאות</td></tr>
          <tr><td>בייטים</td><td>Amazon S3</td><td>העלאה בחלקים בהיקף טרה</td></tr>
          <tr><td>העשרה</td><td>Python ברקע</td><td>שם חיים הפרסרים של תמונה, וידאו, רדאר</td></tr>
          <tr><td>חיפוש</td><td>OpenSearch</td><td>פילטרים על קטלוג גדול</td></tr>
        </table>`,
        say: "ה-API הוא קטלוג, לא צינור. העובדים הם פייתון, כי שם האקוסיסטם של הקבצים. S3 כי שם multipart."
      },
      {
        k: "שקף 6 · החלטות",
        h: "ארבעה דברים שלא אהפוך.",
        html: `<div class="grid2">
          <div class="card"><b>הקובץ לא עובר בשרת</b><span>אחרת כל טרה עולה פעמיים.</span></div>
          <div class="card"><b>מטא-דאטה לפני הבייטים</b><span>אחרת העלאה שנפלה היא רק hash בלי שם.</span></div>
          <div class="card"><b>העשרה לא מחביאה קובץ</b><span>במטלה כתוב where possible. unknown הוא טיפוס.</span></div>
          <div class="card"><b>גלישה לפי אוספים, לא תיקיות</b><span>עץ POSIX הוא איך העזבון נהיה לא שמיש.</span></div>
        </div>`,
        say: "אם שואלים למה לא העלאה רגילה דרך ה-API — כי זה שובר את דרישת הטרה. אם שואלים למה לא עץ תיקיות — כי זה הדבר שכבר יש להם."
      },
      {
        k: "שקף 7 · המסכים",
        h: "העלאה, ואז גלישה לוגית.",
        html: `<div class="grid2">
          <div class="card rd"><b>Ingest</b><span>קודם טופס. אחר כך תור עם אחוזים ושלמות. SIGMF הוא קובץ אחד עם sidecar.</span></div>
          <div class="card"><b>Browse</b><span>אוספים משמאל, פילטרים למעלה, כרטיס עם מטא-דאטה של המשתמש ושל המכונה.</span></div>
        </div>
        <p style="margin-top:16px">אין פונקציונליות מאחורי המסכים — זה מה שביקשו. אחר כך אפשר לפתוח UML אם נכנסים לעומק.</p>`,
        say: "עכשיו עוברים למסך ההעלאה, אחר כך לגלישה. סיפור אחד: מכניסים עם משמעות, מוצאים בלי ללכת לתיקייה."
      }
    ]
  },
  en: {
    navHome: "Home", navPresent: "Present", navPipe: "Pipeline", navUml: "UML", navUpload: "Ingest", navBrowse: "Browse",
    prev: "Previous", next: "Next",
    say: "Say this",
    slides: [
      {
        k: "Slide 1 · The problem",
        h: "Tens of TBs, scattered. And you cannot browse them.",
        html: `<p>That is the brief. Storage is already large and still growing. The files are not one type, and they are not organized in a way people can actually find.</p>
        <p>The system needs two jobs: <b>upload</b>, and <b>browse in a logical way</b>.</p>`,
        say: "The problem is not another disk. It is getting large, diverse files in without losing them, then finding them without walking /mnt/storage3."
      },
      {
        k: "Slide 2 · The requirements",
        h: "Four asks. This is how I solved each.",
        html: `<table>
          <tr><th>The brief</th><th>How I solved it</th></tr>
          <tr><td>Reliable uploads at terabyte scale</td><td>The browser uploads parts straight to S3. A failed part retries alone. A closed tab resumes, it does not restart.</td></tr>
          <tr><td>Highly diverse data — docs, images, video, radar</td><td>A logical catalog row. S3 may hold one object or several. Unknown types stay first-class.</td></tr>
          <tr><td>User metadata at upload time</td><td>Saved before the first byte. A transfer that dies after six hours still has a name and a mission.</td></tr>
          <tr><td>Automatic technical enrichment where possible</td><td>After the file is sealed, a worker reads headers. No parser — the file is still there.</td></tr>
        </table>`,
        say: "Every line in the brief became a design rule. I did not start from tools. I started from the requirement."
      },
      {
        k: "Slide 3 · The idea",
        h: "I split bytes from meaning.",
        html: `<div class="grid2">
          <div class="card" style="border-color:#1f5a40"><b>The store · Amazon S3</b><span>The bytes. Multipart upload. The server does not carry the file — it only signs a short-lived URL.</span></div>
          <div class="card rd"><b>The catalog · API + Postgres</b><span>The meaning. Name, collection, tags, state, permissions. This is where you search, not the bucket.</span></div>
        </div>
        <p style="margin-top:16px">If the API carries a terabyte, it becomes a pipe. If the catalog is a folder tree, you recreate the mess.</p>`,
        say: "I signed a URL. I did not stream a file. S3 keeps and assembles parts. The catalog says what it is and who may see it."
      },
      {
        k: "Slide 4 · End to end",
        h: "Client, server, storage, processing — as asked.",
        html: `<table>
          <tr><th></th><th>Client</th><th>Server</th><th>Storage</th><th>Processing</th></tr>
          <tr><td><b>1 Intent</b></td><td>Metadata + file</td><td>Creates the record</td><td>Opens multipart</td><td>—</td></tr>
          <tr><td><b>2 Transfer</b></td><td>Parts straight to S3</td><td>Remembers what landed</td><td>Holds parts</td><td>—</td></tr>
          <tr><td><b>3 Seal</b></td><td>Done</td><td>Checks integrity</td><td>Assembles one object</td><td>—</td></tr>
          <tr><td><b>4 Enrich</b></td><td>Browse</td><td>Updates catalog</td><td>Read + preview</td><td>Extracts technical metadata</td></tr>
        </table>
        <p style="margin-top:12px">From stage three the file is downloadable. Enrichment does not block it.</p>`,
        say: "That is the whole flow. Four stages, four layers. If a parser fails after that, the file is still in the catalog."
      },
      {
        k: "Slide 5 · Tools",
        h: "A small stack. Each tool for a requirement.",
        html: `<table>
          <tr><th>Layer</th><th>Tool</th><th>Why</th></tr>
          <tr><td>Upload and browse</td><td>React</td><td>Long queue, resume, inspector</td></tr>
          <tr><td>Catalog</td><td>Spring Boot + Postgres</td><td>Records, states, permissions</td></tr>
          <tr><td>Bytes</td><td>Amazon S3</td><td>Multipart at terabyte scale</td></tr>
          <tr><td>Enrichment</td><td>Python in the background</td><td>That is where image, video, radar parsers live</td></tr>
          <tr><td>Search</td><td>OpenSearch</td><td>Facets over a large catalog</td></tr>
        </table>`,
        say: "The API is a catalog, not a pipe. Workers are Python because that is the file ecosystem. S3 because that is multipart."
      },
      {
        k: "Slide 6 · Decisions",
        h: "Four things I would not reverse.",
        html: `<div class="grid2">
          <div class="card"><b>The file does not go through the server</b><span>Otherwise every terabyte is paid twice.</span></div>
          <div class="card"><b>Metadata before bytes</b><span>Otherwise a failed upload is only a hash with no name.</span></div>
          <div class="card"><b>Enrichment does not hide a file</b><span>The brief says where possible. Unknown is a type.</span></div>
          <div class="card"><b>Browse by collections, not folders</b><span>A POSIX tree is how this estate became unusable.</span></div>
        </div>`,
        say: "If they ask why not a normal upload through the API — it breaks the terabyte requirement. If they ask why not a folder tree — that is what they already have."
      },
      {
        k: "Slide 7 · The screens",
        h: "Ingest, then logical browse.",
        html: `<div class="grid2">
          <div class="card rd"><b>Ingest</b><span>Form first. Then a queue with percent and integrity. SIGMF is one asset with a sidecar.</span></div>
          <div class="card"><b>Browse</b><span>Collections on the left, facets on top, a card with user metadata and machine metadata.</span></div>
        </div>
        <p style="margin-top:16px">The screens are not wired — that is what the brief asked. UML is there if they go deep.</p>`,
        say: "Now open ingest, then browse. One story: you put meaning in with the file, you find it without walking a folder."
      }
    ]
  }
};

let lang = "he";
let i = 0;

function slides() { return T[lang].slides; }

function render() {
  const s = slides()[i];
  const say = T[lang].say;
  document.getElementById("stage").innerHTML =
    `<div class="kicker">${s.k}</div><h1 class="${s.h.length > 42 ? "small" : ""}">${s.h}</h1>${s.html}<div class="say"><strong>${say}:</strong> ${s.say}</div>`;
  document.getElementById("count").textContent = (i + 1) + " / " + slides().length;
  document.getElementById("bar").style.width = ((i + 1) / slides().length * 100) + "%";
  document.querySelectorAll("[data-i]").forEach((el) => {
    const k = el.getAttribute("data-i");
    if (T[lang][k]) el.textContent = T[lang][k];
  });
  document.getElementById("btn-en").classList.toggle("on", lang === "en");
  document.getElementById("btn-he").classList.toggle("on", lang === "he");
}

function applyLang(next) {
  lang = next;
  document.documentElement.lang = next;
  document.documentElement.dir = next === "he" ? "rtl" : "ltr";
  render();
}

document.getElementById("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
document.getElementById("next").onclick = () => { i = Math.min(slides().length - 1, i + 1); render(); };
document.getElementById("btn-en").onclick = () => applyLang("en");
document.getElementById("btn-he").onclick = () => applyLang("he");
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const forward = document.documentElement.dir === "rtl" ? e.key === "ArrowLeft" : e.key === "ArrowRight";
    if (forward) i = Math.min(slides().length - 1, i + 1);
    else i = Math.max(0, i - 1);
    render();
  }
});
applyLang("he");
</script>
</body>
</html>
